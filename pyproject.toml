[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robobench"
version = "0.0.1"
description = "Drake-based benchmark for testing arbitrary robot controllers across scenarios."
requires-python = ">=3.10"
dependencies = [
    "drake",
    "numpy",
    "pyyaml",
    "robobench-sdk",
]

[project.scripts]
robobench = "robobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
