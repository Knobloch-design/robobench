[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robobench-sdk"
version = "0.0.1"
description = "Controller-side SDK for robobench. Install this in your controller's environment; it does not depend on Drake."
requires-python = ">=3.10"
# License: to be decided before the repository goes public.
dependencies = [
    "numpy",
    # The generated code in robobench_sdk/proto was built with these versions; keep in step
    # with sdk/scripts/generate_protos.py.
    "grpcio>=1.84",
    "protobuf>=7.35",
]

[project.optional-dependencies]
llm = ["pyyaml"]
dev = ["grpcio-tools>=1.84"]

[tool.setuptools.packages.find]
include = ["robobench_sdk*"]

[tool.setuptools.package-data]
robobench_sdk = ["proto/*.proto", "proto/*.pyi"]
